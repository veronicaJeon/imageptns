name: Deploy Cloudflare Workers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Deploy image runtime worker
        run: npx wrangler deploy --config wrangler.image-runtime.jsonc
      - name: Deploy page worker
        run: npx wrangler deploy --config wrangler.server.jsonc
      - name: Deploy public API worker
        run: npx wrangler deploy --config wrangler.api.jsonc
      - name: Deploy administrator API worker
        run: npx wrangler deploy --config wrangler.admin-api.jsonc
      - name: Deploy router worker
        run: npx wrangler deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
