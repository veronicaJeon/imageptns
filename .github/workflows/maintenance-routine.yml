name: Weekly product and code review

on:
  schedule:
    # GitHub schedules run daily; the due job performs the real review only
    # when seven days have elapsed since the last successful review.
    - cron: "41 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even when the weekly interval has not elapsed
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: imagepartners-maintenance-review
  cancel-in-progress: false

jobs:
  due:
    name: Check weekly interval
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.interval.outputs.due }}
      issue_number: ${{ steps.interval.outputs.issue_number }}
      last_success_at: ${{ steps.interval.outputs.last_success_at }}
    steps:
      - name: Determine whether a full review is due
        id: interval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --state all --limit 100 --json number,title --jq 'map(select(.title == "[maintenance] Image Partners 72-hour review"))[0].number // empty')"
          last_success_at=""

          if [ -n "$issue_number" ]; then
            last_success_at="$(
              gh api --paginate "repos/$GH_REPO/issues/$issue_number/comments" \
                --jq '.[] | select(.body | contains("<!-- imagepartners-maintenance-success -->")) | .created_at' \
                | tail -n 1
            )"
          fi

          due=false
          if [ "$FORCE" = "true" ] || [ -z "$last_success_at" ]; then
            due=true
          else
            now_epoch="$(date -u +%s)"
            last_epoch="$(date -u -d "$last_success_at" +%s)"
            if [ $((now_epoch - last_epoch)) -ge 604800 ]; then
              due=true
            fi
          fi

          {
            echo "due=$due"
            echo "issue_number=$issue_number"
            echo "last_success_at=$last_success_at"
          } >> "$GITHUB_OUTPUT"
          echo "Weekly product review due: $due"

  review:
    name: Run maintenance review
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tracking_issue: ${{ steps.publish.outputs.tracking_issue }}
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Audit all dependencies
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Type check
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Test
        id: test
        continue-on-error: true
        run: npm test

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Setup Supabase CLI
        id: supabase_cli
        continue-on-error: true
        uses: supabase/setup-cli@c44671e41ed90c0841a8ec5e5f88b7f0adc830ea
        with:
          version: 2.111.0

      - name: Reserve isolated Supabase ports
        if: steps.supabase_cli.outcome == 'success'
        shell: bash
        run: |
          base_port=$((20000 + GITHUB_RUN_ID % 10000))
          sed -i "s/^port = 55001$/port = $base_port/" supabase/config.toml
          sed -i "s/^port = 55002$/port = $((base_port + 1))/" supabase/config.toml
          sed -i "s/^shadow_port = 54320$/shadow_port = $((base_port + 2))/" supabase/config.toml
          sed -i "s/^port = 55003$/port = $((base_port + 3))/" supabase/config.toml
          sed -i "s/^port = 55005$/port = $((base_port + 5))/" supabase/config.toml
          sed -i "s/^port = 54329$/port = $((base_port + 9))/" supabase/config.toml
          echo "Supabase CI port range starts at $base_port."

      - name: Apply migrations to a fresh local database
        id: database_start
        continue-on-error: true
        run: supabase start

      - name: Lint database schema
        id: database_lint
        continue-on-error: true
        run: supabase db lint --local --level error

      - name: Check production health
        id: health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output "$response_file" --write-out '%{http_code}' https://www.imagepartners.kr/api/health)"
          node - "$response_file" "$http_code" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("fs");
          const [file, code, output] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const healthy = code === "200"
            && payload?.checks?.database?.status === "ok"
            && payload?.checks?.storage?.status === "ok"
            && payload?.checks?.previewIntegrity?.status === "ok"
            && !["error", "stale"].includes(payload?.checks?.ai?.status);
          const operations = payload?.checks?.operations?.status ?? "unknown";
          fs.appendFileSync(output, `operations_review=${operations}\n`);
          if (!healthy) process.exit(1);
          console.log(JSON.stringify({ status: payload.status, durationMs: payload.durationMs, checks: payload.checks }));
          NODE

      - name: Check main and Production release alignment
        id: release_alignment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          curl --silent --show-error --location --fail --retry 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 --output "$response_file" \
            https://www.imagepartners.kr/api/health
          node - "$response_file" "$GITHUB_SHA" <<'NODE'
          const fs = require("fs");
          const [file, expectedSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          if (payload?.release?.commitSha !== expectedSha || payload?.release?.commitRef !== "main") {
            console.error(JSON.stringify({ expectedSha: expectedSha.slice(0, 12), deployedRef: payload?.release?.commitRef ?? null }));
            process.exit(1);
          }
          console.log(JSON.stringify({ releaseAligned: true, commit: expectedSha.slice(0, 12) }));
          NODE

      - name: Check public routes
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for path in "/" "/library" "/contact" "/terms" "/privacy" "/business-info" "/api/images?limit=1"; do
            curl --silent --show-error --location --fail --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output /dev/null "https://www.imagepartners.kr${path}"
          done

      - name: Check checkout readiness boundary
        id: checkout_readiness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          curl --silent --show-error --location --fail --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 --output "$response_file" https://www.imagepartners.kr/api/checkout/readiness
          node - "$response_file" <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const validBoundary = payload?.accountConfigured === true
            && payload?.paidOrdersAvailable === true
            && (payload?.disclosureComplete === true || payload?.betaOverride === true);
          if (!validBoundary) process.exit(1);
          console.log(JSON.stringify(payload));
          NODE

      - name: Inspect main branch protection
        id: branch_protection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh api "repos/$GH_REPO/branches/main/protection" >/dev/null 2>&1; then
            echo "result=verified" >> "$GITHUB_OUTPUT"
          else
            echo "result=unprotected-or-token-cannot-verify" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop local Supabase
        if: always()
        continue-on-error: true
        run: supabase stop --no-backup

      - name: Derive active improvement candidates
        id: candidates
        if: always()
        env:
          MAINTENANCE_RESULTS: >-
            {"install":"${{ steps.install.outcome }}","audit":"${{ steps.audit.outcome }}","typecheck":"${{ steps.typecheck.outcome }}","lint":"${{ steps.lint.outcome }}","test":"${{ steps.test.outcome }}","build":"${{ steps.build.outcome }}","supabase_cli":"${{ steps.supabase_cli.outcome }}","database_start":"${{ steps.database_start.outcome }}","database_lint":"${{ steps.database_lint.outcome }}","health":"${{ steps.health.outcome }}","operations_review":"${{ steps.health.outputs.operations_review || 'unknown' }}","release_alignment":"${{ steps.release_alignment.outcome }}","smoke":"${{ steps.smoke.outcome }}","checkout_readiness":"${{ steps.checkout_readiness.outcome }}","branch_protection":"${{ steps.branch_protection.outputs.result || 'unverified' }}"}
        run: |
          node scripts/derive-maintenance-candidates.mjs "$RUNNER_TEMP/maintenance-candidates.json"
          echo "count=$(jq length "$RUNNER_TEMP/maintenance-candidates.json")" >> "$GITHUB_OUTPUT"

      - name: Publish maintenance report
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRACKING_ISSUE: ${{ needs.due.outputs.issue_number }}
          LAST_SUCCESS_AT: ${{ needs.due.outputs.last_success_at }}
          INSTALL: ${{ steps.install.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SUPABASE_CLI: ${{ steps.supabase_cli.outcome }}
          DATABASE_START: ${{ steps.database_start.outcome }}
          DATABASE_LINT: ${{ steps.database_lint.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          OPERATIONS_REVIEW: ${{ steps.health.outputs.operations_review || 'unknown' }}
          RELEASE_ALIGNMENT: ${{ steps.release_alignment.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          CHECKOUT_READINESS: ${{ steps.checkout_readiness.outcome }}
          BRANCH_PROTECTION: ${{ steps.branch_protection.outputs.result || 'unverified' }}
          CANDIDATE_COUNT: ${{ steps.candidates.outputs.count || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          failed=false
          for result in "$INSTALL" "$AUDIT" "$TYPECHECK" "$LINT" "$TEST" "$BUILD" "$SUPABASE_CLI" "$DATABASE_START" "$DATABASE_LINT" "$HEALTH" "$RELEASE_ALIGNMENT" "$SMOKE" "$CHECKOUT_READINESS"; do
            if [ "$result" != "success" ]; then failed=true; fi
          done

          report_file="$(mktemp)"
          {
            echo "## 주간 제품·코드 점검 — $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "- 기준 커밋: \`$GITHUB_SHA\`"
            echo "- 실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- 직전 성공: ${LAST_SUCCESS_AT:-없음}"
            echo "- 결과: $([ "$failed" = true ] && echo '실패 — 조치 필요' || echo '통과')"
            echo
            echo "| 점검 | 결과 |"
            echo "| --- | --- |"
            echo "| 의존성 설치 | $INSTALL |"
            echo "| 전체 의존성 audit | $AUDIT |"
            echo "| TypeScript | $TYPECHECK |"
            echo "| Lint | $LINT |"
            echo "| 테스트 | $TEST |"
            echo "| 프로덕션 빌드 | $BUILD |"
            echo "| Supabase CLI | $SUPABASE_CLI |"
            echo "| Fresh DB migration | $DATABASE_START |"
            echo "| DB schema lint | $DATABASE_LINT |"
            echo "| 운영 health | $HEALTH |"
            echo "| 일일 운영관리자 점검 | $OPERATIONS_REVIEW |"
            echo "| main·Production 정합성 | $RELEASE_ALIGNMENT |"
            echo "| 공개 경로 smoke | $SMOKE |"
            echo "| 계좌이체 공개 경계 | $CHECKOUT_READINESS |"
            echo "| main 보호 확인 | $BRANCH_PROTECTION |"
            echo
            echo "### 점진적 개선 루프"
            echo
            echo "- 활성 개선 후보: ${CANDIDATE_COUNT}건"
            echo "- 각 후보는 별도 이슈로 생성·갱신되며 \`/approve MNT-…\` 또는 \`/reject MNT-…\`로 결정합니다."
            echo "- 승인된 후보에는 \`codex-ready\` 라벨을 붙이며 Codex 예약 작업이 격리된 worktree에서 한 건씩 구현·검증합니다."
            echo "- 병합, DB 적용, 데이터 삭제, 운영 배포는 별도 승인 게이트를 통과해야 합니다."
            if [ "$failed" = false ]; then
              echo
              echo "<!-- imagepartners-maintenance-success -->"
            fi
          } > "$report_file"

          gh label create maintenance --color 1D76DB --description "Scheduled maintenance and operational review" --force >/dev/null
          gh label create maintenance-candidate --color FBCA04 --description "Candidate derived by the maintenance improvement loop" --force >/dev/null
          gh label create approval-required --color D93F0B --description "Human decision is required" --force >/dev/null
          gh label create codex-ready --color 5319E7 --description "Ready for the Codex scheduled development task" --force >/dev/null
          gh label create priority-p0 --color B60205 --description "Critical maintenance priority" --force >/dev/null
          gh label create priority-p1 --color D93F0B --description "High maintenance priority" --force >/dev/null
          if [ -z "$TRACKING_ISSUE" ]; then
            TRACKING_ISSUE="$(gh api --method POST "repos/$GH_REPO/issues" \
              -f title="[maintenance] Image Partners 72-hour review" \
              -f body="이 이슈는 주간 제품·코드 점검 결과를 누적합니다. 자동 점검은 운영 상태를 변경하지 않습니다." \
              -f 'labels[]=maintenance' \
              --jq '.number')"
          fi
          gh issue comment "$TRACKING_ISSUE" --body-file "$report_file"
          echo "tracking_issue=$TRACKING_ISSUE" >> "$GITHUB_OUTPUT"

          active_ids_file="$(mktemp)"
          jq -r '.[].id' "$RUNNER_TEMP/maintenance-candidates.json" > "$active_ids_file"
          while IFS= read -r candidate; do
            candidate_id="$(jq -r '.id' <<<"$candidate")"
            priority="$(jq -r '.priority' <<<"$candidate")"
            title="$(jq -r '.title' <<<"$candidate")"
            evidence="$(jq -r '.evidence' <<<"$candidate")"
            proposal="$(jq -r '.proposal' <<<"$candidate")"
            acceptance="$(jq -r '.acceptance' <<<"$candidate")"
            change_class="$(jq -r '.changeClass' <<<"$candidate")"
            marker="<!-- maintenance-candidate:$candidate_id -->"
            existing_issue="$(gh issue list --state all --label maintenance-candidate --limit 200 --json number,body --jq ".[] | select(.body | contains(\"$marker\")) | .number" | head -n 1)"
            candidate_body="$(mktemp)"
            {
              echo "$marker"
              echo "## ${priority} 개선 후보 — ${candidate_id}"
              echo
              echo "**관찰 근거**"
              echo
              echo "$evidence"
              echo
              echo "**제안 작업**"
              echo
              echo "$proposal"
              echo
              echo "**완료 기준**"
              echo
              echo "$acceptance"
              echo
              echo "- 변경 분류: \`$change_class\`"
              echo "- 기준 커밋: \`$GITHUB_SHA\`"
              echo "- 최신 점검: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo
              echo "구현을 시작하려면 저장소 OWNER/MEMBER/COLLABORATOR가 다음 댓글을 남깁니다."
              echo
              echo "\`/approve $candidate_id\`"
              echo
              echo "거절하거나 보류하려면 \`/reject $candidate_id\`를 사용합니다. 구현 승인에는 운영 배포·DB 적용·데이터 삭제 승인이 포함되지 않습니다."
            } > "$candidate_body"

            priority_label="$(printf '%s' "$priority" | tr '[:upper:]' '[:lower:]' | sed 's/^/priority-/')"
            if [ -z "$existing_issue" ]; then
              gh api --method POST "repos/$GH_REPO/issues" \
                -f title="[maintenance][$priority] $title" \
                -F body="@$candidate_body" \
                -f 'labels[]=maintenance' \
                -f 'labels[]=maintenance-candidate' \
                -f 'labels[]=approval-required' \
                -f "labels[]=$priority_label" >/dev/null
            else
              gh issue edit "$existing_issue" --body-file "$candidate_body" >/dev/null
              if [ "$(gh issue view "$existing_issue" --json state --jq '.state')" = "CLOSED" ]; then
                gh issue reopen "$existing_issue" >/dev/null
                for stale_label in maintenance-approved maintenance-rejected maintenance-in-progress codex-ready; do
                  gh api --method DELETE "repos/$GH_REPO/issues/$existing_issue/labels/$stale_label" >/dev/null 2>&1 || true
                done
                gh issue edit "$existing_issue" --add-label approval-required >/dev/null
                gh issue comment "$existing_issue" --body="최근 점검에서 동일 후보가 다시 발견되어 재개했습니다." >/dev/null
              fi
            fi
          done < <(jq -c '.[]' "$RUNNER_TEMP/maintenance-candidates.json")

          while IFS=$'\t' read -r issue_number issue_body; do
            candidate_id="$(printf '%s' "$issue_body" | sed -n 's/.*<!-- maintenance-candidate:\([^ ]*\) -->.*/\1/p' | head -n 1)"
            if [ -n "$candidate_id" ] && ! grep -Fxq "$candidate_id" "$active_ids_file"; then
              gh issue close "$issue_number" --comment="현재 검사와 운영 백로그에서 이 후보가 더 이상 활성 상태가 아니므로 자동 종료합니다. 실제 운영 반영 근거가 부족하면 다시 열고 근거를 추가해 주세요." >/dev/null
            fi
          done < <(gh issue list --state open --label maintenance-candidate --limit 200 --json number,body --jq '.[] | [.number, (.body | gsub("\\n"; " "))] | @tsv')

          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" = true ]; then exit 1; fi

  advisor_review:
    name: Run non-blocking Grok and Gemini review
    needs: [due, review]
    if: always() && needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Build sanitized review input
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRACKING_ISSUE: ${{ needs.review.outputs.tracking_issue }}
        shell: bash
        run: |
          set -euo pipefail
          tracking_issue="$TRACKING_ISSUE"
          if [ -z "$tracking_issue" ]; then
            tracking_issue="$(gh issue list --state all --limit 100 --json number,title --jq 'map(select(.title == "[maintenance] Image Partners 72-hour review"))[0].number // empty')"
          fi
          if [ -z "$tracking_issue" ]; then
            echo "Maintenance tracking issue was not found."
            exit 1
          fi

          latest_report="$(gh api --paginate "repos/$GH_REPO/issues/$tracking_issue/comments" \
            --jq '[.[] | select((.body | contains("## 주간 제품·코드 점검")) or (.body | contains("## 72시간 유지보수 점검")))] | last.body // "점검 보고 없음"')"
          candidates="$(gh issue list --state open --label maintenance-candidate --limit 50 \
            --json number,title,body,labels,url,updatedAt \
            --jq 'map({number,title,body:(.body[0:4000]),labels:(.labels | map(.name)),url,updatedAt})')"
          {
            echo "# Image Partners 유지보수 검수 입력"
            echo
            echo "## 최신 결정론적 점검"
            echo "$latest_report"
            echo
            echo "## 현재 열린 개선 후보(JSON)"
            echo '```json'
            echo "$candidates"
            echo '```'
          } > "$RUNNER_TEMP/maintenance-advisor-input.md"
          echo "tracking_issue=$tracking_issue" >> "$GITHUB_OUTPUT"

      - name: Ask Grok for an independent review
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/run-maintenance-advisor.mjs grok "$RUNNER_TEMP/maintenance-advisor-input.md" "$RUNNER_TEMP/grok-report.json" "$RUNNER_TEMP/grok-comment.md"

      - name: Publish Grok result
        if: always() && steps.input.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.input.outputs.tracking_issue }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/grok-comment.md"

      - name: Ask Gemini for an independent review
        if: always() && steps.input.outcome == 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/run-maintenance-advisor.mjs gemini "$RUNNER_TEMP/maintenance-advisor-input.md" "$RUNNER_TEMP/gemini-report.json" "$RUNNER_TEMP/gemini-comment.md"

      - name: Publish Gemini result
        if: always() && steps.input.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.input.outputs.tracking_issue }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/gemini-comment.md"
