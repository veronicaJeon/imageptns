version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env.docker.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
